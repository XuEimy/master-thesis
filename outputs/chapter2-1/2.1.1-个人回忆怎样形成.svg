<text x="302.5" y="385.0" font-size="29" fill="#163f51" font-weight="600" text-anchor="middle">自传体知识</text>
<rect x="145" y="485" width="315" height="90" rx="16" fill="#e6f4f6" stroke="#b7d2dc" stroke-width="2" />
<text x="302.5" y="540.0" font-size="29" fill="#163f51" font-weight="600" text-anchor="middle">当前目标</text>
