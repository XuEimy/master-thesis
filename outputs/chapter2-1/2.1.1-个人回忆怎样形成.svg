<path d="M315 471 V439" fill="none" stroke="#176a83" stroke-width="2.5" marker-end="url(#a)"/>
<text x="328" y="461" font-size="19" fill="#607e8b" font-weight="400" text-anchor="start">相互联系</text>
<rect x="620" y="375" width="390" height="135" rx="16" fill="#d4edf0" stroke="#b7d2dc" stroke-width="2" />
<text x="815.0" y="424" font-size="29" fill="#163f51" font-weight="600" text-anchor="middle">线索引导的提取与建构</text>
<text x="815.0" y="463" font-size="22" fill="#607e8b" font-weight="400" text-anchor="middle">提取、组织与自身有关的信息</text>
<path d="M460 375 H535 V420 H605" fill="none" stroke="#176a83" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M460 530 H535 V469 H605" fill="none" stroke="#176a83" stroke-width="2.5" marker-end="url(#a)"/>
