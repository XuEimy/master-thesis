<text x="1100" y="417" font-size="21" fill="#176a83" font-weight="400" text-anchor="middle">形成</text>
<rect x="1185" y="375" width="310" height="135" rx="16" fill="#d4edf0" stroke="#b7d2dc" stroke-width="2" />
<text x="1340.0" y="424" font-size="29" fill="#163f51" font-weight="600" text-anchor="middle">具体的个人回忆</text>
<text x="1340.0" y="463" font-size="22" fill="#607e8b" font-weight="400" text-anchor="middle">亲历事件及其体验</text>
<text x="105" y="654" font-size="23" fill="#138b91" font-weight="600" text-anchor="start">补充视角 · 基本系统模型</text>
<text x="105" y="690" font-size="25" fill="#163f51" font-weight="400" text-anchor="start">视觉、听觉、空间、语言、情绪与叙事等系统相互作用，共同参与情景记忆。</text>
<text x="105" y="737" font-size="21" fill="#607e8b" font-weight="400" text-anchor="start">这一模型补充说明回忆经验的多种成分，不与上图合并为同一套理论。</text>
