<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1960" viewBox="0 0 1800 1960"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#426d7d" stroke-width="1.7"/></marker></defs><rect width="1800" height="1960" fill="white"/><g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="60" y="64" font-size="39" fill="#173b4c" font-weight="600" text-anchor="start">2.1 个人回忆与影像表达：三个问题的文献依据</text>
<text x="60" y="110" font-size="22" fill="#758892" font-weight="400" text-anchor="start">依文献内容重绘的概念示意｜箭头表达理论关系、使用过程或分析关系，不代表统一的因果模型。</text>
<path d="M60 142 L1740 142" fill="none" stroke="#c6d8df" stroke-width="1.5"/>
<text x="60" y="188" font-size="34" fill="#147f88" font-weight="600" text-anchor="start">2.1.1</text>
<text x="190" y="188" font-size="33" fill="#173b4c" font-weight="600" text-anchor="start">个人回忆是什么，又怎样形成？</text>
<text x="1740" y="188" font-size="20" fill="#758892" font-weight="400" text-anchor="end">理论研究</text>
<a xlink:href="https://pubmed.ncbi.nlm.nih.gov/10789197/">
<text x="80" y="245" font-size="22" fill="#147f88" font-weight="600" text-anchor="start">[1] Conway &amp; Pleydell-Pearce（2000）｜自我—记忆系统</text>
</a>
<rect x="90" y="285" width="320" height="92" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="250.0" y="322" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">自传体知识</text>
<text x="250.0" y="358" font-size="21" fill="#294959" font-weight="400" text-anchor="middle">与自身经历有关的知识</text>
<rect x="500" y="285" width="320" height="92" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="660.0" y="322" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">当前目标</text>
<text x="660.0" y="358" font-size="21" fill="#294959" font-weight="400" text-anchor="middle">工作自我的关注与目的</text>
<path d="M425 330 L485 330" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M250 377 L250 402" fill="none" stroke="#c6d8df" stroke-width="1.5"/>
