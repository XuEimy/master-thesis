<text x="1100.0" y="1347" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">自传影像叙事</text>
<text x="1100.0" y="1383" font-size="21" fill="#294959" font-weight="400" text-anchor="middle">组织过去与当下的理解</text>
<path d="M1282 1360 L1352 1360" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" />
<rect x="1365" y="1310" width="350" height="100" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="1540.0" y="1347" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">自我与身份的表达</text>
<text x="1540.0" y="1383" font-size="21" fill="#294959" font-weight="400" text-anchor="middle">呈现、追问个人意义</text>
<text x="80" y="1460" font-size="24" fill="#294959" font-weight="600" text-anchor="start">分析重点：个人影像被重新使用和组织，参与作者对自身及家庭关系的理解。</text>
<text x="80" y="1502" font-size="22" fill="#956f47" font-weight="400" text-anchor="start">适用边界：这是叙事与自我呈现的研究，不能直接作为回忆能力改善的证据。</text>
