<text x="1110.0" y="538.0" font-size="24" fill="#294959" font-weight="600" text-anchor="middle">语言与叙事</text>
<rect x="1370" y="498" width="240" height="62" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="1490.0" y="538.0" font-size="24" fill="#294959" font-weight="600" text-anchor="middle">情绪等系统</text>
<rect x="1160" y="389" width="300" height="66" rx="13" fill="#dceef0" stroke="#c6d8df" stroke-width="1.5"/>
<text x="1310.0" y="431.0" font-size="28" fill="#294959" font-weight="600" text-anchor="middle">情景记忆</text>
<path d="M1110 354 L1194 384" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M1490 354 L1427 384" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M1110 494 L1194 461" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<path d="M1490 494 L1427 461" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
<text x="1310" y="596" font-size="22" fill="#657c87" font-weight="400" text-anchor="middle">多种系统相互作用；图中仅列部分系统</text>
<text x="80" y="636" font-size="24" fill="#294959" font-weight="600" text-anchor="start">理论要点：回忆具有建构性；回忆经验涉及多种系统，不能只按画面内容理解。</text>
<path d="M60 672 L1740 672" fill="none" stroke="#c6d8df" stroke-width="1.5"/>
<text x="60" y="718" font-size="34" fill="#147f88" font-weight="600" text-anchor="start">2.1.2</text>
<text x="190" y="718" font-size="33" fill="#173b4c" font-weight="600" text-anchor="start">照片和数字材料怎样参与回想？</text>
<text x="1740" y="718" font-size="20" fill="#758892" font-weight="400" text-anchor="end">方法研究＋过程观察</text>
<a xlink:href="https://doi.org/10.1080/14725860220137345">
<text x="80" y="775" font-size="22" fill="#147f88" font-weight="600" text-anchor="start">[3] Harper（2002）｜照片引谈法</text>
</a>
<rect x="80" y="818" width="240" height="80" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="200.0" y="867.0" font-size="25" fill="#294959" font-weight="600" text-anchor="middle">照片进入访谈</text>
<path d="M330 858 L370 858" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" />
<rect x="380" y="818" width="240" height="80" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="500.0" y="867.0" font-size="25" fill="#294959" font-weight="600" text-anchor="middle">观看与讨论</text>
<path d="M630 858 L670 858" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" />
<rect x="680" y="818" width="230" height="80" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="795.0" y="867.0" font-size="22" fill="#294959" font-weight="600" text-anchor="middle">信息、感受与记忆</text>
<text x="80" y="943" font-size="23" fill="#294959" font-weight="400" text-anchor="start">方法贡献：观察人如何借助影像讲述经历。</text>
<text x="80" y="980" font-size="22" fill="#956f47" font-weight="400" text-anchor="start">不能由此推定照片提高回忆准确性。</text>
<path d="M940 768 L940 1035" fill="none" stroke="#c6d8df" stroke-width="1.5"/>
<a xlink:href="https://doi.org/10.1186/s41235-025-00627-4">
<text x="980" y="775" font-size="22" fill="#147f88" font-weight="600" text-anchor="start">[4] Hutmacher 等（2025）｜思维出声研究</text>
</a>
<text x="980" y="815" font-size="23" fill="#294959" font-weight="400" text-anchor="start">41 人：回忆约一年前的重要日与随机日</text>
<rect x="980" y="850" width="270" height="80" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="1115.0" y="899.0" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">内部回忆</text>
<rect x="1450" y="850" width="270" height="80" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="1585.0" y="899.0" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">外部资源</text>
<path d="M1266 877 L1434 877" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" />
<path d="M1434 904 L1266 904" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" />
<text x="1350" y="955" font-size="22" fill="#147f88" font-weight="600" text-anchor="middle">反复切换</text>
<text x="980" y="996" font-size="22" fill="#294959" font-weight="400" text-anchor="start">随机日：数字资源使用量与内外切换次数更多。</text>
<text x="980" y="1031" font-size="21" fill="#657c87" font-weight="400" text-anchor="start">外部资源包括照片等，不限于影像。</text>
<text x="80" y="1080" font-size="24" fill="#294959" font-weight="600" text-anchor="start">两类依据分别说明：影像可以参与讲述；回忆过程可以在内部经验与外部资料之间往返。</text>
<path d="M60 1117 L1740 1117" fill="none" stroke="#c6d8df" stroke-width="1.5"/>
<text x="60" y="1163" font-size="34" fill="#147f88" font-weight="600" text-anchor="start">2.1.3</text>
<text x="190" y="1163" font-size="33" fill="#173b4c" font-weight="600" text-anchor="start">影像怎样组织经历并表达个人意义？</text>
<text x="1740" y="1163" font-size="20" fill="#758892" font-weight="400" text-anchor="end">作品分析</text>
<a xlink:href="https://doi.org/10.1080/17503280.2020.1815123">
<text x="80" y="1220" font-size="22" fill="#147f88" font-weight="600" text-anchor="start">[5] Rosas &amp; Dittus（2021；在线发表于 2020）｜档案与蒙太奇</text>
</a>
<text x="80" y="1260" font-size="23" fill="#294959" font-weight="400" text-anchor="start">研究材料：Tarnation、51 Birch Street、The Marina Experiment 三部自传纪录片</text>
<rect x="80" y="1310" width="310" height="100" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="235.0" y="1347" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">个人／家庭影像档案</text>
<text x="235.0" y="1383" font-size="21" fill="#294959" font-weight="400" text-anchor="middle">既有影像材料</text>
<path d="M402 1360 L472 1360" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" />
<rect x="485" y="1310" width="350" height="100" rx="13" fill="#dceef0" stroke="#c6d8df" stroke-width="1.5"/>
<text x="660.0" y="1347" font-size="26" fill="#294959" font-weight="600" text-anchor="middle">选择、蒙太奇与讲述</text>
<text x="660.0" y="1383" font-size="21" fill="#294959" font-weight="400" text-anchor="middle">赋予材料新的语境</text>
