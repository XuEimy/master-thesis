<rect x="270" y="434" width="370" height="82" rx="13" fill="#dceef0" stroke="#c6d8df" stroke-width="1.5"/>
<text x="455.0" y="484.0" font-size="25" fill="#294959" font-weight="600" text-anchor="middle">线索引导的提取与建构</text>
<path d="M455 516 L455 545" fill="none" stroke="#426d7d" stroke-width="2" marker-end="url(#arr)" />
<text x="455" y="579" font-size="28" fill="#173b4c" font-weight="600" text-anchor="middle">形成具体的自传体回忆</text>
<path d="M880 238 L880 602" fill="none" stroke="#c6d8df" stroke-width="1.5"/>
<a xlink:href="https://pubmed.ncbi.nlm.nih.gov/26151796/">
<text x="950" y="245" font-size="22" fill="#147f88" font-weight="600" text-anchor="start">[2] Rubin（2006）｜基本系统模型</text>
</a>
<rect x="990" y="288" width="240" height="62" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="1110.0" y="328.0" font-size="24" fill="#294959" font-weight="600" text-anchor="middle">视觉与听觉</text>
<rect x="1370" y="288" width="240" height="62" rx="13" fill="#edf5f7" stroke="#c6d8df" stroke-width="1.5"/>
<text x="1490.0" y="328.0" font-size="24" fill="#294959" font-weight="600" text-anchor="middle">空间与其他感官</text>
