<text x="270" y="660" font-size="26" fill="#163f51" font-weight="400" text-anchor="start">Tarnation · 51 Birch Street · The Marina Experiment</text>
<text x="105" y="713" font-size="25" fill="#163f51" font-weight="400" text-anchor="start">三部作品用于分析：个人影像如何通过新的叙事语境参与身份与自我的表达。</text>
