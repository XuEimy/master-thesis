<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#456377" stroke-width="1.5"/></marker><marker id="back" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9" fill="none" stroke="#b87539" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="2100" fill="#ffffff"/>
<g font-family="PingFang SC,Noto Sans CJK SC,Microsoft YaHei,sans-serif">
<text x="60" y="65" font-size="40" fill="#183549" font-weight="600">个人回忆唤起研究 · 技术路线</text>
<text x="60" y="110" font-size="25" fill="#344d60" font-weight="400">研究聚焦：个人线索如何转化为记录内容，并参与 AI 材料组织与影像表达</text>
<text x="60" y="153" font-size="20" fill="#657783" font-weight="400">拟议研究方案｜实线：研究推进　虚线：依据失败环节返回修订</text>
<text x="60" y="206" font-size="22" fill="#657783" font-weight="600">研究任务</text>
<text x="250" y="206" font-size="22" fill="#657783" font-weight="600">研究步骤与关键关系</text>
<text x="1140" y="206" font-size="22" fill="#657783" font-weight="600">研究方法与阶段产出</text>
<rect x="250" y="240" width="830" height="110" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="277" font-size="27" fill="#183549" font-weight="600">01  确定情境与对象</text>
<text x="276" y="317" font-size="22" fill="#344d60" font-weight="400">具体亲历事件、已有材料、记录习惯与回看经历</text>
<path d="M665,350 L665,373" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="378" width="830" height="165" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="415" font-size="27" fill="#183549" font-weight="600">02  分析线索与使用条件</text>
<path d="M665,543 L665,566" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="571" width="830" height="125" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="608" font-size="27" fill="#183549" font-weight="600">03  建立初步关联框架</text>
<text x="276" y="648" font-size="22" fill="#344d60" font-weight="400">个人线索 → 记录内容 → 组织与表达方式</text>
<text x="276" y="679" font-size="22" fill="#344d60" font-weight="400">登记适用情境、证据来源、使用代价与反例</text>
<path d="M665,696 L665,730" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="735" width="830" height="165" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="772" font-size="27" fill="#183549" font-weight="600">04  联合探索记录与交互方案</text>
<path d="M665,900 L665,923" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="928" width="830" height="110" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="965" font-size="27" fill="#183549" font-weight="600">05  采集试用与筛选</text>
<text x="276" y="1005" font-size="22" fill="#344d60" font-weight="400">检查目标线索保留、信息遗漏、操作负担与活动打断</text>
<path d="M665,1038 L665,1061" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="1066" width="830" height="110" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="1103" font-size="27" fill="#183549" font-weight="600">06  整理可追溯材料</text>
<text x="276" y="1143" font-size="22" fill="#344d60" font-weight="400">原始记录＋本人补述＋时间与情境信息＋处理记录</text>
<path d="M665,1176 L665,1210" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="1215" width="830" height="165" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="1252" font-size="27" fill="#183549" font-weight="600">07  开发 AI 辅助与回看交互</text>
<path d="M665,1380 L665,1403" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="1408" width="830" height="125" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="1445" font-size="27" fill="#183549" font-weight="600">08  整合原型与先导测试</text>
<text x="276" y="1485" font-size="22" fill="#344d60" font-weight="400">采集 → 关联 → 线索确认 → AI 组织与表达 → 回看修改</text>
<text x="276" y="1516" font-size="22" fill="#344d60" font-weight="400">检查可运行性、任务理解、条件差异；确定测量与研究规模</text>
<path d="M665,1533 L665,1567" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="1572" width="830" height="225" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="1609" font-size="27" fill="#183549" font-weight="600">09  比较材料选择与组织依据</text>
<text x="276" y="1649" font-size="22" fill="#344d60" font-weight="400">候选条件：A 原始材料回看；B AI 按时间／事件组织</text>
<text x="276" y="1680" font-size="22" fill="#344d60" font-weight="400">主要对照：B ↔ C；C 为 AI 结合本人确认的关键线索组织</text>
<text x="276" y="1711" font-size="22" fill="#344d60" font-weight="400">核心结果：回忆是否发生、事件与体验内容、表达贴切度</text>
<text x="276" y="1742" font-size="22" fill="#344d60" font-weight="400">另行评价：来源辨认、可核对事实一致性、使用负担</text>
<text x="276" y="1773" font-size="22" fill="#344d60" font-weight="400">控制／记录：素材池、输出时长、前期接触、用户投入与顺序</text>
<path d="M665,1797 L665,1820" fill="none" stroke="#456377" stroke-width="2"  marker-end="url(#arrow)"/>
<rect x="250" y="1825" width="830" height="125" rx="12" fill="#f3f7fa" stroke="#cbd7df" stroke-width="1.5"/>
<text x="276" y="1862" font-size="27" fill="#183549" font-weight="600">10  综合结果，验证并修订框架</text>
<text x="276" y="1902" font-size="22" fill="#344d60" font-weight="400">得到支持／部分条件支持／暂未支持／证据不足</text>
<text x="276" y="1933" font-size="22" fill="#344d60" font-weight="400">形成有适用边界的关联框架、设计原则与原型</text>
<path d="M665,438 V524" stroke="#cbd7df"/>
<text x="276" y="460" font-size="23" fill="#116777" font-weight="600">回忆线索与记录需要</text>
<text x="276" y="493" font-size="21" fill="#344d60" font-weight="400">材料与讲述对照、信息缺口</text>
<text x="276" y="521" font-size="21" fill="#344d60" font-weight="400">区分回忆、复述与推断</text>
<text x="687" y="460" font-size="23" fill="#116777" font-weight="600">记录行为与使用条件</text>
<text x="687" y="493" font-size="21" fill="#344d60" font-weight="400">记录时机、操作与携带</text>
<text x="687" y="521" font-size="21" fill="#344d60" font-weight="400">可接受负担及用户控制</text>
<path d="M665,795 V881" stroke="#cbd7df"/>
<text x="276" y="817" font-size="23" fill="#116777" font-weight="600">记录策略、输入与硬件</text>
<text x="276" y="850" font-size="21" fill="#344d60" font-weight="400">按线索需要联合选择</text>
<text x="276" y="878" font-size="21" fill="#344d60" font-weight="400">采集能力与个人习惯共同约束</text>
<text x="687" y="817" font-size="23" fill="#116777" font-weight="600">本人参与与交互方式</text>
<text x="687" y="850" font-size="21" fill="#344d60" font-weight="400">确认线索、补述与修改</text>
<text x="687" y="878" font-size="21" fill="#344d60" font-weight="400">检查框架能否解释设计取舍</text>
<path d="M665,1275 V1361" stroke="#cbd7df"/>
<text x="276" y="1297" font-size="23" fill="#116777" font-weight="600">07A  AI 辅助处理</text>
<text x="276" y="1330" font-size="21" fill="#344d60" font-weight="400">筛选、检索、事件关联与组织</text>
<text x="276" y="1358" font-size="21" fill="#344d60" font-weight="400">保留来源，检查遗漏与错误关联</text>
<text x="687" y="1297" font-size="23" fill="#116777" font-weight="600">07B  回看与表达交互</text>
<text x="687" y="1330" font-size="21" fill="#344d60" font-weight="400">本人确认、选择、补述与修改</text>
<text x="687" y="1358" font-size="21" fill="#344d60" font-weight="400">区分表达意图和事实依据</text>
